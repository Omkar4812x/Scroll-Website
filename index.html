    <style>

      }
      html {
        background: #0b0b0a;
      }
      body {
        margin: 0;
        background: #0b0b0a;

        min-height: 100vh;
      }

  <body>
    <div id="world"></div>
    <script src="skills/lets-scroll/references/scrub-engine.js"></script>
